<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About QuickNotes</title>
</head>
<body>
    <header>
        <nav><a href="index.html">Home</a></nav>
        <nav><a href="about.html">About</a></nav>
    </header>
    <main>
        <h2>About quicknotes</h2>
        <p>Ideas captured to quickly organize short pieces of information. </p>
        <p>It act as a reminder</p>
    </main>
    <section>
        <h2>How to use QuickNotes</h2>
        <ol>
            <li>writting ideas</li>
            <li>As a reminder</li>
        </ol>
    </section>
    <section>
        <h2>Features</h2>
        <ul>
            <li>Quick note creation</li>
        </ul>
    </section>
    <section>
        <h2>Keyboard shortcuts</h2>
        <table>
            <thead>
                <tr>
                    <th>Shortcut</th>
                    <th>Action</th>
                </tr>  
            </thead> 
            <tbody>
            <tr>
                <td>control+ c</td>
                <td>Copy</td>
            </tr> 
            <tr>
                <td>control+v</td>
                <td>Paste</td>
            </tr>
            </tbody>
        </table>
    </section>
    <section>
        <h2>Send feedback</h2>
        <form action="">
            <label for="name">Enter your name:</label>
            <input type="text" id="name" required>
            <label for="email">Enter your email:</label>
            <input type="email" id="email" required>
            <label for="message">Give your feedback here</label>
            <textarea name="message" id="messageText" required></textarea>
            <button type="button">submit</button>

        </form>
    </section>
</body>
</html>
