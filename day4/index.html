<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <main class="container">
        <h1>Note</h1>
    <label for="note-text">Your note</label><br>
    <!-- <label for="note-text">Write your note here</label> -->

    <p id="word-count" class="counter"> N words </p>
    <button id="clear-button" type="button">Clear</button>
    <button id="toggle-button" type="button">Toggle</button>
    </main>
</body>
</html>
